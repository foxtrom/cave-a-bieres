<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Brasserie Ensen</title>
  <meta name="description" content="Cave à bières de la Brasserie Ensen : stock des brassins, garde, bouteilles offertes.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#2b2420">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- Barre d'état opaque : avec « black-translucent », iOS 26 donne à l'appli installée
       une fenêtre trop courte de la hauteur de la barre d'état (bug WebKit 301108) et la
       barre d'onglets flotte au-dessus d'une bande noire. iOS ne relit ce réglage qu'à
       l'installation : supprimer puis réinstaller l'appli après l'avoir changé. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Brasserie Ensen">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Thème choisi à la main, appliqué avant l'affichage (pas d'éclair clair/sombre).
    try {
      var theme = localStorage.getItem('ensen-theme');
      if (theme === 'clair' || theme === 'sombre') document.documentElement.dataset.theme = theme;
    } catch (e) {}
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="app">
    <header id="entete"></header>
    <div id="maj" class="banniere banniere-maj" role="status" hidden></div>
    <main id="vue" tabindex="-1"></main>
    <div id="barre-actions"></div>
    <nav id="onglets" aria-label="Navigation principale" hidden>
      <a href="#/" data-onglet="cave">
        <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2h4M10.5 2v4.5L8 10v10.5A1.5 1.5 0 0 0 9.5 22h5a1.5 1.5 0 0 0 1.5-1.5V10l-2.5-3.5V2"/><path d="M8 13h8"/></svg>
        <span>Cave</span>
      </a>
      <a href="#/historique" data-onglet="historique">
        <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9M10 13h4"/></svg>
        <span>Historique</span>
      </a>
      <a href="#/nouveau" data-onglet="nouveau" class="onglet-ajout">
        <span class="bulle"><svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>
        <span>Ajouter</span>
      </a>
      <a href="#/stock" data-onglet="stock">
        <span class="avec-pastille"><svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21V9l9-6 9 6v12"/><path d="M7 21v-9h10v9M7 15h10M7 18h10"/></svg><span class="pastille" id="pastille-stock" hidden></span></span>
        <span>Stock</span>
      </a>
      <a href="#/reglages" data-onglet="reglages">
        <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>
        <span>Réglages</span>
      </a>
    </nav>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="feuille" aria-label="Panneau"></dialog>
  <noscript><p style="padding:24px">Brasserie Ensen a besoin de JavaScript pour fonctionner.</p></noscript>
</body>
</html>
